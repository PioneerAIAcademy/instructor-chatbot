[tool]
[tool.poetry]
name = "app"
version = "0.1.0"
description = "BYU-Pathway Instructor Assistant backend"
authors = [ "PioneerAIAcademy" ]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.109.1"
python-dotenv = "^1.0.0"
aiostream = "^0.5.2"
voyageai = "^0.2.3"
langfuse = "4.16.0"  # OpenTelemetry-based SDK; 2.x used the ingestion API Langfuse Cloud shuts down 2026-11-16
pytector = "^0.2.0"
requests = "^2.33.1"
langdetect = "^1.0.9"
psutil = "^5.9.8"
httpx = "^0.27.0"
gunicorn = "^21.2.0"
slowapi = "^0.1.9"
torch = "2.2.2"
dateparser = "^1.2.0"
pyyaml = "^6.0"  # tests/eval/questions.yaml (eval scripts)
transformers = "5.3.0"
sentry-sdk = { version = "^2.21.0", extras = ["fastapi"] }

# Reader pins (CLAUDE.md §5). Upstream installs these through the `llama-index`
# meta-package; only the parts the chat path imports are listed here.
llama-index-core = "0.10.58"
llama-index-llms-openai = "^0.1.27"
llama-index-embeddings-openai = "^0.1.11"
llama-index-vector-stores-pinecone = "^0.1.3"
# Needed by Settings.llm.astructured_predict (suggested questions): the OpenAI
# structured-output program imports llama_index.program.openai, which imports
# llama_index.agent.openai. Same versions upstream locks.
llama-index-program-openai = "0.1.7"
llama-index-agent-openai = "0.2.6"

# Security pins: transitive deps held to security-patched versions.
# Remove a pin once upstream parents include the fix natively.
aiohttp = "~3.14.1"
cryptography = "~50.0.0"
pillow = "~12.2.0"
pygments = "~2.20.0"
python-multipart = "~0.0.26"

[tool.poetry.dependencies.uvicorn]
extras = [ "standard" ]
version = "^0.23.2"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-asyncio = "^1.3.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = [ "poetry-core" ]
build-backend = "poetry.core.masonry.api"
